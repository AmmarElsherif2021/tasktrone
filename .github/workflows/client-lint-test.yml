name: client-lint-test

on:
  pull_request:
    paths:
      - 'client/**'
      - 'contracts/**'
      - '.github/workflows/client-lint-test.yml'
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'contracts/**'
      - '.github/workflows/client-lint-test.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + contract tests
        run: npm test

  # Optional/gated: reports results as a check but never blocks merging
  # (continue-on-error), since e2e/ mocks a lot of app state (fake Supabase
  # session, apiClient responses) and is more prone to drifting out of sync
  # with real UI changes than the unit/contract suite above.
  e2e-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14
