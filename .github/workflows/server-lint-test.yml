name: server-lint-test

on:
  pull_request:
    paths:
      - 'server/**'
      - 'contracts/**'
      - '.github/workflows/server-lint-test.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'contracts/**'
      - '.github/workflows/server-lint-test.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

  # Runs only on push to master (i.e. after merge), not on every PR — see docs/CI.md.
  # Needs a real Postgres, so it's kept out of the PR-gated fast job above.
  integration-tests:
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasktrone
          POSTGRES_PASSWORD: tasktrone
          POSTGRES_DB: tasktrone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktrone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://tasktrone:tasktrone@localhost:5432/tasktrone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests (Postgres adapter + API, real database)
        run: npm run test:integration -- --ci
