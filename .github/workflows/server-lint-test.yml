name: server-lint-test

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-lint-test.yml'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/server-lint-test.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci
