version: '3.9'

# Local Postgres for server development and integration tests.
# Usage: docker compose up -d   (from server/)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasktrone
      POSTGRES_PASSWORD: tasktrone
      POSTGRES_DB: tasktrone
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasktrone']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
